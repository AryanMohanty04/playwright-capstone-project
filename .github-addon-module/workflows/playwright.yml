name: Playwright Tests & Allure Report

on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard_index: [1, 2, 3]
    env:
      CI: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Install Playwright Browsers
        # Only install chromium in CI (matches config above)
        run: npx playwright install chromium --with-deps

      - name: Run Playwright Tests
        run: npm run test:ci -- --shard=${{ matrix.shard_index }}/3
        continue-on-error: true

      - name: Upload Allure Raw Results (Shard ${{ matrix.shard_index }})
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-shard-${{ matrix.shard_index }}
          path: allure-results/
          if-no-files-found: warn
          retention-days: 14

  report:
    if: always()
    needs: [test]
    timeout-minutes: 30
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Download All Allure Results
        uses: actions/download-artifact@v4
        with:
          pattern: allure-results-shard-*
          merge-multiple: true
          path: allure-results/

      - name: Check downloaded results
        run: |
          echo "=== allure-results contents ==="
          find allure-results -type f | head -30 || echo "No files found"
          echo "Total: $(find allure-results -type f 2>/dev/null | wc -l) files"

      - name: Generate Allure Report
        # Use npx directly — more reliable than npm run in CI
        run: npx allure generate allure-results --clean -o allure-report

      - name: Verify Report Generated
        run: |
          if [ -d allure-report ] && [ "$(ls -A allure-report)" ]; then
            echo "✅ Report generated successfully"
            ls allure-report/
          else
            echo "❌ Report directory missing or empty"
            exit 1
          fi

      - name: Upload Allure HTML Report (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report
          path: allure-report/
          if-no-files-found: warn
          retention-days: 14

      - name: Deploy to GitHub Pages
        # Deploy on any push (not just main) so you can test it
        if: always() && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: allure-report
        continue-on-error: true